name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  postgres-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: phase2_test
          POSTGRES_PASSWORD: phase2_ci_only
          POSTGRES_DB: phase2_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase2_test -d phase2_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable job-local service only; these are not provider/production secrets.
      DATABASE_URL: postgresql://phase2_test:phase2_ci_only@127.0.0.1:5432/phase2_disposable
      DIRECT_DATABASE_URL: postgresql://phase2_test:phase2_ci_only@127.0.0.1:5432/phase2_disposable
      TEST_DATABASE_URL: postgresql://phase2_test:phase2_ci_only@127.0.0.1:5432/phase2_disposable
      AUTH_TEST_DATABASE: disposable
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm db:deploy
      - run: pnpm db:status
      - run: pnpm db:smoke
      - run: pnpm test:integration
      - run: pnpm test:profiles
      - run: pnpm test:jobs
      - run: pnpm test:hiring
      - run: pnpm test:matching
      - run: pnpm test:messaging
      - run: pnpm test:http
